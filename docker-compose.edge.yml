# Machine Manual RAG — Edge query-only (≈8 GB RAM)
#
# Prerequisites:
#   1. Docker Desktop / Engine
#   2. Image: manual-rag-query:latest (or set EDGE_IMAGE)
#      Build: ./scripts/build.sh --edge --tag manual-rag-query:latest
#   3. A prebuilt data/ folder (chroma_db + images + manuals) from a full ingest machine
#
# Start:
#   HOST_DATA_DIR=/path/to/data docker compose -f docker-compose.edge.yml up -d
#
# Prefer scripts/load_and_run_edge.sh or launcher/ManualRAG.exe — they mount
# only host roots that exist and open the UI.

services:
  manual-rag:
    image: ${EDGE_IMAGE:-manual-rag-query:latest}
    container_name: manual-rag-edge
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
    environment:
      - MANUAL_RAG_IN_DOCKER=1
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      # 8GB edge profile
      - QUERY_ONLY=true
      - ENABLE_RERANKER=false
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - MAX_GENERATION_IMAGES=${MAX_GENERATION_IMAGES:-1}
      - TOP_K_RETRIEVAL=${TOP_K_RETRIEVAL:-10}
      - TOP_K_RERANK=${TOP_K_RERANK:-5}
      - HF_HOME=/opt/hf_models
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - DATA_DIR=/app/data
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - IMAGE_STORE_DIR=/app/data/images
      - MANUAL_STORE_DIR=/app/data/manuals
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-base-en-v1.5}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-./data}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
