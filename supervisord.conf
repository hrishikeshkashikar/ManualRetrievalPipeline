; ══════════════════════════════════════════════════════════════════════════
;  supervisord.conf — Process supervisor for Manual RAG container
;
;  Manages two processes inside the single Docker container:
;    1. ollama serve — Local LLM/VLM inference server (starts immediately)
;    2. rag-api      — FastAPI application (started by entrypoint after Ollama ready)
; ══════════════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

; ── Unix socket so supervisorctl can connect ──────────────────────────────
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Ollama Server ─────────────────────────────────────────────────────────
[program:ollama]
command=/usr/bin/ollama serve
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=5
stdout_logfile=/var/log/supervisor/ollama.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/supervisor/ollama.err
stderr_logfile_maxbytes=10MB
environment=OLLAMA_MODELS="/root/.ollama/models",HOME="/root"

; ── RAG API (FastAPI + Uvicorn) ───────────────────────────────────────────
; autostart=false — entrypoint.sh starts this only after Ollama health-check passes
[program:rag-api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
directory=/app
autostart=false
autorestart=true
priority=20
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/rag-api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/rag-api.err
stderr_logfile_maxbytes=20MB
