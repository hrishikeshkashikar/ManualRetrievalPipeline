# Machine Manual RAG — single self-contained container
#
# Knowledge base (embeddings + manuals + images) lives in HOST_DATA_DIR.
# Copy that folder to a USB stick and remount on another machine — no re-ingest.
#
# Prefer: ./scripts/run.sh [/path/to/data]
# That script generates docker-compose.override.yml with OS-safe /host mirrors
# so the UI "Change Data Path" can resolve /Users/... and /Volumes/... paths.

services:
  manual-rag:
    image: manual-rag:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME:-BAAI/bge-base-en-v1.5}
        RERANKER_MODEL: ${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
    container_name: manual-rag-app
    ports:
      # Ollama stays inside the container (OLLAMA_BASE_URL=127.0.0.1:11434).
      # Do not publish 11434 — it clashes with a host Ollama install.
      - "${API_PORT:-8000}:8000"
    volumes:
      # Primary portable knowledge base (laptop folder OR USB path)
      - ${HOST_DATA_DIR:-./data}:/app/data
    environment:
      - MANUAL_RAG_IN_DOCKER=1
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}
      - HF_HOME=/opt/hf_models
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - DATA_DIR=/app/data
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - IMAGE_STORE_DIR=/app/data/images
      - MANUAL_STORE_DIR=/app/data/manuals
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-base-en-v1.5}
      - RERANKER_MODEL_NAME=${RERANKER_MODEL_NAME:-BAAI/bge-reranker-v2-m3}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-./data}
    restart: unless-stopped
    # Uncomment for NVIDIA GPU hosts
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
